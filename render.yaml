services:
  - type: web
    name: poke-tactics
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      # URL de la base de datos de Neon (postgresql://...). Se pega a mano en el panel de Render.
      - key: DATABASE_URL
        sync: false
