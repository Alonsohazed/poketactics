.mbox.cfg .mclose:hover{opacity:1;background:rgba(255,255,255,.08);filter:none}
.mbox.cfg .mclose svg{display:none} .mbox.cfg .mclose::after{content:'';display:block;width:100%;height:100%;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M5 5L19 19M19 5L5 19' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E") center/18px 18px no-repeat}
.mbox.cfg h1{font-family:var(--display);font-weight:400;font-size:24px;color:#f4d27a;letter-spacing:.06em;margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid rgba(244,210,122,.35)}
.mbox.cfg p{color:#c3d2e0}
.cfgRow{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px 16px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.cfgRow>b{font-weight:800;font-size:15px;color:#eef2ff}
.cfgOpts{display:flex;flex-wrap:wrap;gap:6px 22px}
.rd{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:15px;color:#a9b8c8;position:relative}
.rd input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.rd i{width:24px;height:24px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 50% 35%,#2a3c4e,#0b141c 72%);box-shadow:inset 0 0 0 2px #070d12,inset 0 0 0 3px #3f5468,0 1px 0 rgba(255,255,255,.08)}
.rd:hover i{box-shadow:inset 0 0 0 2px #070d12,inset 0 0 0 3px #6a8aa8}
.rd input:checked+i{box-shadow:inset 0 0 0 2px #070d12,inset 0 0 0 4px #f0c860,0 0 10px rgba(240,200,96,.55)}
.rd input:checked+i::after{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff2b0,#e0a830)}
.rd input:checked~span{color:#fff;font-weight:800}
.cfgVol{display:flex;align-items:center;gap:12px}
.cfgVol input[type=range]{flex:1;max-width:none;accent-color:#f0c860}
.cfgVol b{min-width:34px;text-align:right;color:#f4d27a;font-family:var(--display);font-weight:400}
.cfgBtns{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.cfgBtn{border:0;clip-path:none;cursor:pointer;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.04em;padding:9px 20px;border-radius:10px;text-shadow:none;
  background:linear-gradient(180deg,#f0d078,#b8862e);color:#2a1a05;box-shadow:0 2px 0 #5a3f12,0 4px 10px rgba(0,0,0,.4)}
.cfgBtn:hover{filter:brightness(1.1)}
.cfgBtn.ghost{background:rgba(255,255,255,.07);color:#eef2ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.cfgBtn.red{background:linear-gradient(180deg,#e05a5a,#9a1f1f);color:#fff;box-shadow:0 2px 0 #4a0a0a,0 4px 10px rgba(0,0,0,.4)}
.cfgBtn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.cfgSep{height:1px;margin:18px -30px 14px;background:linear-gradient(90deg,transparent,#c9a24a 20%,#c9a24a 80%,transparent)}
.cfgSur{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.cfgSur>div{display:flex;gap:10px;flex-wrap:wrap}
.cfgSur small{color:#a9b8c8;font-size:12.5px;max-width:260px}
@media (max-width:620px){ .cfgRow{grid-template-columns:1fr;gap:6px} .cfgSep{margin-left:-16px;margin-right:-16px} .mbox.cfg{padding:22px 16px 18px} }
@keyframes cbBan{0%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
</style>
</head>
<body>
<div id="menuScene" aria-hidden="true"><canvas></canvas><div class="mnUnits"></div></div>
<header class="top">
  <div class="brand"><img class="brandLogo" src="img/logo.webp" alt="Poké Tactics · Autochess" width="900" height="252"></div>
  <div class="roundBar" id="roundBar"><div class="rbLeft"><div class="rbTitle" id="stage">Fase 1-1</div></div><div class="pills" id="pills"></div><span class="rbClock" title="Tiempo de planificación"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" id="rbRing" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg><b class="rbTimer" id="rbTimer">·</b></span><span class="rbAlive" id="rbAlive" hidden></span><div class="phase" id="phase"></div></div>
  <button class="btn ghost icon" id="fsBtn" title="Pantalla completa" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5V3.5h6v2.4H5.9v3.6zm11-6h6v6h-2.4V5.9H14.5zM3.5 14.5h2.4v3.6h3.6v2.4h-6zm15.6 0h2.4v6h-6v-2.4h3.6z"/></svg></button>
  <button class="btn ghost icon" id="menuBtn" title="Configuración" aria-label="Configuración"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19.92 8.65L22.73 9.6v4.8l-2.81.95.05-.12 1.32 2.66-3.4 3.4-2.66-1.32.12-.05-.95 2.81H9.6l-.95-2.81.12.05-2.66 1.32-3.4-3.4 1.32-2.66.05.12-2.81-.95V9.6l2.81-.95-.05.12-1.32-2.66 3.4-3.4 2.66 1.32-.12.05.95-2.81h4.8l.95 2.81-.12-.05 2.66-1.32 3.4 3.4-1.32 2.66zM15.9 12a3.9 3.9 0 1 0-7.8 0 3.9 3.9 0 1 0 7.8 0z"/></svg></button>
</header>

<main class="layout">
  <aside class="panel traitsPanel">
    <div id="traits"></div>
    <div id="augWrap"></div>
  </aside>
  <section class="center">
    <div class="viewInfo" id="viewInfo" hidden></div>
    <div class="boardInfo"><span id="streakInfo"></span></div>
    <div id="boardWrap"><div class="items" id="items" aria-label="Objetos"></div><div class="augBar" id="augBar" title="Clic derecho: ver la lista de aumentos" hidden></div><div class="augList" id="augList" hidden></div><div id="boardStack"><canvas id="gl" aria-hidden="true"></canvas><canvas id="cv" aria-label="Tablero de combate"></canvas><div id="cbBanner" aria-hidden="true"></div></div></div>
  </section>
  <aside class="right">
    <div class="ucard hidden" id="ucard" aria-live="polite"></div>
    <div class="side">
      <div class="sideTabs" role="tablist">
        <button role="tab" data-tab="pl" aria-selected="true" title="Vida de los entrenadores" aria-label="Vida de los entrenadores"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="9" cy="7.5" r="3.6"/><path d="M2.5 20c0-4 2.9-6.6 6.5-6.6s6.5 2.6 6.5 6.6z"/><circle cx="17" cy="8.5" r="2.9" opacity=".75"/><path d="M15.8 13.6c3.4.2 5.7 2.6 5.7 6.4h-4.6c0-2.6-.4-4.6-1.1-6.4z" opacity=".75"/></svg></button>
        <button role="tab" data-tab="dmg" aria-selected="false" title="Daño del combate" aria-label="Daño del combate"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 3h4.5l9 9-1.4 1.4-1.6-1.6-1.6 1.6L3 4.5z"/><path d="M21 3h-4.5l-9 9 1.4 1.4 1.6-1.6 1.6 1.6L21 4.5z" opacity=".8"/><path d="M5.6 15.6l2.8 2.8-2 2-1.1-1.1-1.9 1.9-1.1-1.1 1.9-1.9-1.1-1.1zM18.4 15.6l-2.8 2.8 2 2 1.1-1.1 1.9 1.9 1.1-1.1-1.9-1.9 1.1-1.1z"/></svg></button>
        
      </div>
      <div class="tabBody" id="tabPl"><div id="players"></div></div>
      <div class="tabBody" id="tabDmg" hidden>
        <div class="dmgModes"><button data-m="dmg" aria-pressed="true">Daño</button><button data-m="tank" aria-pressed="false">Recibido</button><button data-m="heal" aria-pressed="false">Curación</button></div>
        <p class="small muted" id="dmgTitle"></p><div id="dmgList"></div>
      </div>
      <div class="tabBody" id="tabLog" hidden><ul class="log" id="log"></ul></div>
    </div>
    <div class="feed hidden" id="feed"><h3>Habilidades del combate</h3><ol id="feedList"></ol></div>
  </aside>
</main>

<footer class="shop" id="shopPanel">
  <div class="shopTop">
    <div class="lvl"><span class="lvN">Nv. <span class="px" id="lvl">1</span></span><div class="xpbar"><i id="xpbar"></i></div><span class="small" id="xpTxt"></span></div>
    <div class="odds" id="odds" title="Probabilidad de cada coste en tu nivel"></div>
    <div class="goldWrap"><div class="gold" id="goldBox" title="Pulsa para ver tus ingresos"><span class="coin"></span><span id="gold">0</span></div>
      <span class="streak" id="streak" hidden><i></i><b>0</b></span><div class="incomePop" id="incomeInfo" hidden></div></div>
  </div>
  <div class="shopMain">
    <div class="sellMsg" id="sellMsg">Suelta para vender</div>
    <div class="sbtns">
      <button class="btn sbBtn xp" id="xpBtn" title="Comprar 4 de EXP (tecla F)"><span class="sbTxt"><b>Comprar XP</b><span class="sbCost"><i class="coin" id="xpCoin"></i><em id="xpCostTxt">4</em></span></span>
        <img class="sbIco" src="img/ui/xp.png" alt="" width="47" height="42" draggable="false"></button>
      <button class="btn sbBtn rr" id="rerollBtn" title="Rerrolear la tienda (tecla D)"><span class="sbTxt"><b>Rerrolear</b><span class="sbCost"><i class="coin" id="rrCoin"></i><em id="rrCostTxt">2</em></span></span>
        <img class="sbIco" src="img/ui/roll.png" alt="" width="47" height="42" draggable="false"></button>
    </div>
    <div class="cardsWrap"><button class="btn icon lockCorner" id="lockBtn" title="Bloquear tienda para la siguiente ronda">🔓</button><div class="cards" id="cards"></div></div>
  </div>
</footer>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="auth" class="screen">
  <div class="authBox">
    <h1 class="logo"><img src="img/logo.webp" alt="Poké Tactics · Autochess" width="900" height="252"></h1>
    <form class="glass" id="authForm" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabLogin" aria-selected="true">Entrar</button>
        <button type="button" role="tab" id="tabReg" aria-selected="false">Crear cuenta</button>
      </div>
      <div class="field"><label for="auUser">Usuario</label><input id="auUser" name="username" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false" required><span class="hint" id="auUserHint" hidden>De 3 a 16 letras, números o _</span></div>
      <div class="field"><label for="auPass">Contraseña</label><div class="pw"><input id="auPass" name="password" type="password" autocomplete="current-password" maxlength="72" required><button type="button" id="auShow" aria-label="Mostrar contraseña">Ver</button></div></div>
      <div class="field" id="auPass2Wrap" hidden><label for="auPass2">Repite la contraseña</label><input id="auPass2" name="password2" type="password" autocomplete="new-password" maxlength="72"></div>
      <div class="formErr" id="auErr" role="alert"></div>
      <button class="btn primary" id="auGo" type="submit">Entrar</button>
    </form>
  </div>
</div>

<div id="menu" class="screen hidden">
  <div class="mnLayout">
    <h1 class="logo mnLogo"><img src="img/logo.webp" alt="Poké Tactics · Autochess" width="900" height="252"></h1>
    <nav class="mnNav" aria-label="Menú principal">
      <button class="pxb pxb-main" id="playBtn"><i data-i="ball" data-s="44"></i><span class="pxbT"><b>Normal</b><small>Dificultad adaptativa · salas con amigos</small></span><i class="pxCaret" aria-hidden="true"></i></button>
      <button class="pxb pxb-alt" id="rankedBtn"><i data-i="ranked" data-s="36"></i><span class="pxbT"><b>Clasificatoria</b><small>Rango, divisiones y LP</small></span><i class="pxCaret" aria-hidden="true"></i></button>
      <div class="mnRow">
        <button class="pxb pxb-sq" id="gachaBtn"><i data-i="ball" data-s="32"></i><span>Gacha</span></button>
        <button class="pxb pxb-sq" id="histBtn"><i data-i="hourglass" data-s="32"></i><span>Historial</span></button>
        <button class="pxb pxb-sq" id="dexMenuBtn"><i data-i="dex" data-s="32"></i><span>Pokédex</span></button>
        <button class="pxb pxb-sq" id="recMenuBtn"><i data-i="bag" data-s="32"></i><span>Objetos</span></button>
        <button class="pxb pxb-sq" id="howBtn"><i data-i="book" data-s="32"></i><span>Guía</span></button>
        <button class="pxb pxb-sq" id="optBtn"><i data-i="gear" data-s="32"></i><span>Opciones</span></button>
      </div>
    </nav>
    <aside class="tcard pxpanel" id="menuWho" aria-label="Tu entrenador"></aside>
  </div>
  <button class="pxb frBtn" id="frBtn" type="button" aria-controls="frPanel" aria-expanded="false"><span>Amigos</span></button>
  <aside class="pxpanel frPanel hidden" id="frPanel" aria-label="Amigos"></aside>
  <div class="pxpanel annBar hidden" id="annBar" role="status" aria-live="polite"></div>
  <span class="ver">v1.1</span>
</div>

<div class="modal hidden" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="queueBar" class="pxpanel hidden" role="status" aria-live="polite"></div>
<div id="toast"></div>
<div id="ghost"></div>
<div id="tip"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="ui-art.js"></script>
<script src="cosmetics.js"></script>
<script src="augments.js"></script>
<script src="game.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module" src="board3d.js"></script>
</body>
</html>
