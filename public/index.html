<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poké Tactics</title>
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#141d3a; --panel:#141c36; --panel2:#1b2548; --panel3:#243161; --ink:#eef2ff; --muted:#93a0c8;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16); --bench:#1a2446;
  --red:#f0533d; --red2:#b8291a; --blue:#4c8dff; --gold:#f4c04e; --gold2:#a87410; --good:#3fd27a; --bad:#ff5a5f;
  --c1:#9aa3b5; --c2:#2fbf63; --c3:#3d86ff; --c4:#b25cf0; --c5:#ffb21f;
  --tS:#aeb9cc; --tG:#f0c040; --tP:#c97bff;
  --btn1:#2b3a70; --btn2:#1d2851; --btnEdge:#090e20;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Lilita One","Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#e7edf8; --bg2:#d6e0f3; --panel:#ffffff; --panel2:#f1f5fd; --panel3:#e2e9f8; --ink:#16203d; --muted:#5b678c;
  --line:rgba(22,32,61,.1); --line2:rgba(22,32,61,.18); --bench:#dfe7f6;
  --btn1:#ffffff; --btn2:#e7edf9; --btnEdge:#aab7d6; --shadow:0 10px 26px rgba(30,45,90,.14);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:600 14px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--blue) 18%,transparent),transparent 70%),var(--bg);
  padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{-webkit-user-drag:none}
.muted{color:var(--muted)} .small{font-size:12px}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em}

/* ---------- botones ---------- */
.btn{position:relative;border:1px solid var(--line2);background:linear-gradient(180deg,var(--btn1),var(--btn2));border-radius:11px;padding:8px 14px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--btnEdge),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .08s,filter .15s,box-shadow .08s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btnEdge),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(180deg,#ff7a5c,var(--red) 55%,#d63a25);border-color:#ff9c84;color:#fff;box-shadow:0 3px 0 var(--red2),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.primary:active{box-shadow:0 1px 0 var(--red2)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#e0a524);border-color:#ffe9a8;color:#3b2604;box-shadow:0 3px 0 var(--gold2),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn[disabled]:active{transform:none}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:7px 10px;min-width:38px}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line2);
  flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.brand{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px;letter-spacing:.03em}
.ball{width:22px;height:22px;border-radius:50%;background:linear-gradient(#ff5b43 0 46%,#141a33 46% 54%,#fff 54%);border:2px solid #141a33;position:relative;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ball::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid #141a33;left:50%;top:50%;transform:translate(-50%,-50%)}
.stage{font-family:var(--display);font-size:16px;padding:3px 12px;border-radius:999px;background:var(--panel3);border:1px solid var(--line2)}
.pills{display:flex;gap:4px}
.pill{width:30px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:13px;opacity:.75}
.pill.past{opacity:.3}
.pill.cur{opacity:1;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--panel2));box-shadow:0 0 12px color-mix(in srgb,var(--gold) 45%,transparent)}
.phase{margin-left:auto;font-weight:900;font-size:15px}
.netTag{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--blue);color:#fff}

/* ---------- distribución ---------- */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 290px;gap:14px;padding:14px 16px;max-width:1500px;margin:0 auto;align-items:start}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:16px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.18)}
.panel h2{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
#boardWrap{width:100%;display:flex;justify-content:center;position:relative}
/* El tablero 3D (#gl, WebGL) va debajo y la capa 2D (#cv: barras, textos, entrenadores) encima */
#boardStack{position:relative;max-width:100%;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{position:relative;display:block;touch-action:none;cursor:grab;max-width:100%}
.boardInfo{display:flex;gap:8px;justify-content:center;font-weight:800;flex-wrap:wrap;text-align:center}
.boardInfo span:not(:empty){padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.feed{width:100%;max-width:660px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:14px;padding:8px 10px;font-size:12.5px}
.feed.hidden{display:none}
.feed h3{margin:0 0 6px;font-size:11px;color:var(--muted);font-family:var(--display);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.feed ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.feed li{display:flex;gap:6px;align-items:baseline;padding:4px 8px;border-radius:8px;background:var(--panel3);border-left:4px solid var(--blue);animation:slideIn .25s ease-out}
.feed li.foe{border-left-color:var(--red)}
.feed li .mv{font-weight:900}
.feed li .dt{color:var(--muted)}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ---------- sinergias ---------- */
.trait{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border-radius:12px;margin-bottom:5px;background:var(--panel3);border:1px solid transparent;cursor:help;opacity:.7}
.trait.on{opacity:1;border-color:color-mix(in srgb,var(--tc) 70%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,var(--panel3)),var(--panel3))}
.trait .ti{width:32px;height:32px;display:grid;place-items:center;font-size:16px;flex:none;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:var(--panel)}
.trait.on .ti{background:var(--tc)}
.trait .tn{font-weight:800;flex:1;min-width:0}
.trait .tb{font-size:11px;color:var(--muted)}
.trait .tb b{color:var(--ink)}
.trait .tc{font-family:var(--display);font-size:15px}
.augs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.aug{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;border:2px solid var(--tc);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--tc) 35%,var(--panel2)),var(--panel));cursor:help;box-shadow:0 0 10px color-mix(in srgb,var(--tc) 35%,transparent)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--panel3);border:1px solid var(--line2);margin:2px 2px 0 0}

/* ---------- objetos ---------- */
.ii{--ic:var(--c1);position:relative;display:inline-grid;place-items:center;width:var(--is,40px);height:var(--is,40px);border-radius:10px;flex:none;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--ic) 30%,#232d55),#10162c 80%);
  border:2px solid var(--ic);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.35);overflow:hidden}
.ii img{width:80%;height:80%;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.ii i{font-style:normal;font-size:calc(var(--is,40px)*.5);line-height:1}
.ii.comp{--ic:#aab4c8}
.ii.full{--ic:var(--gold)}
.ii.full::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
.ii.emb{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ic) 45%,#2a3566),#0e1430 80%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2),0 0 10px color-mix(in srgb,var(--ic) 50%,transparent)}
.ii.emb img{width:86%;height:86%}
@keyframes shine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.items{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:48px;align-items:center;padding:6px 10px;border-radius:14px;background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px solid var(--line)}
.item{cursor:grab;touch-action:none;user-select:none;transition:transform .12s;animation:pop .3s ease-out}
.item:hover{transform:translateY(-3px) scale(1.06)}
.item .ii{--is:44px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

/* ---------- ficha del Pokémon ---------- */
.right{display:flex;flex-direction:column;gap:14px}
.ucard{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 16%,var(--panel2)),var(--panel));border:2px solid var(--tc,var(--line2));border-radius:18px;padding:12px;position:sticky;top:76px;max-height:calc(100vh - 230px);overflow:auto;box-shadow:var(--shadow)}
.ucard.hidden{display:none}
.uc-head{display:flex;gap:10px;align-items:center}
.uc-head .spr{background:radial-gradient(circle,color-mix(in srgb,var(--tc) 40%,transparent),transparent 70%);border-radius:14px}
.uc-name{font-family:var(--display);font-size:20px;line-height:1.1}
.uc-sub{font-size:12px;color:var(--muted)}
.uc-x{margin-left:auto;align-self:flex-start;border:1px solid var(--line2);background:var(--panel3);border-radius:9px;width:30px;height:30px;font-size:14px;cursor:pointer}
.uc-hp{height:8px;border-radius:5px;background:var(--panel3);overflow:hidden;margin:8px 0 2px}
.uc-hp i{display:block;height:100%;background:linear-gradient(90deg,#2fbf63,#7cf0a4)}
.uc-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;margin:10px 0;font-size:12.5px}
.uc-stats div{display:flex;justify-content:space-between;background:var(--panel3);border-radius:8px;padding:4px 8px}
.uc-stats b{font-family:var(--display);font-weight:400}
.uc-ab{border-radius:12px;padding:10px;background:color-mix(in srgb,var(--tc) 14%,var(--panel3));border:1px solid color-mix(in srgb,var(--tc) 70%,transparent);margin:8px 0}
.uc-ab .t{font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:6px}
.uc-ab .m{font-size:11px;color:var(--muted);font-weight:800}
.uc-ab p{margin:4px 0 0;font-size:12.5px}
.uc-evo{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:6px 0}
.uc-evo .f{display:flex;flex-direction:column;align-items:center;font-size:10.5px;padding:4px;border-radius:10px;border:1px solid transparent;cursor:help;width:72px;text-align:center}
.uc-evo .f.on{border-color:var(--tc);background:var(--panel3)}
.uc-items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.slot{border:2px dashed var(--line2);border-radius:12px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;text-align:center;position:relative;padding:5px;color:var(--muted)}
.slot.full{border:1px solid var(--line2);background:var(--panel3);color:var(--ink)}
.slot .ii{--is:34px}
.slot .rm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);background:var(--red);color:#fff;font-weight:900;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}

/* ---------- entrenadores ---------- */
.pl{display:grid;grid-template-columns:38px 1fr auto;gap:2px 8px;align-items:center;padding:5px 8px 6px 5px;border-radius:12px;margin-bottom:4px;border:1px solid transparent}
.pl.me{background:color-mix(in srgb,var(--blue) 18%,var(--panel3));border-color:color-mix(in srgb,var(--blue) 50%,transparent)}
.pl.opp{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel3))}
.pl.dead{opacity:.4;filter:grayscale(1)}
.pl.click{cursor:pointer}
.pl.click:not(.me):hover{background:var(--panel3);border-color:var(--line2)}
.pl.watch{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel3))}
.poTag{display:inline-block;margin-right:4px;padding:0 4px;border-radius:999px;font-size:10px;font-weight:900;background:color-mix(in srgb,var(--red) 30%,var(--panel3));border:1px solid color-mix(in srgb,var(--red) 60%,transparent);vertical-align:1px}
.poTag.eye{background:color-mix(in srgb,var(--gold) 30%,var(--panel3));border-color:var(--gold)}
.viewInfo{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,var(--panel2));border:1px solid var(--gold);font-weight:800}
.pl .em{grid-row:span 2}
.pl .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .hp{font-family:var(--display);font-size:15px;text-align:right}
.hpbar{height:6px;background:var(--panel);border-radius:4px;overflow:hidden;grid-column:2/4;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#2fbf63,#7cf0a4);transition:width .5s}
.head{--hs:38px;width:var(--hs);height:var(--hs);border-radius:50%;flex:none;background:var(--panel) var(--src) no-repeat 50% 12%/190%;image-rendering:pixelated;border:2px solid var(--line2);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-size:18px}
.pl.me .head{border-color:var(--blue)}
.log{font-size:12px;color:var(--muted);max-height:200px;overflow:auto;margin:0;padding-left:16px}
.log li{margin-bottom:3px}

/* ---------- tienda ---------- */
.shop{position:sticky;bottom:0;background:linear-gradient(180deg,var(--panel2),var(--panel));border-top:1px solid var(--line2);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;z-index:4;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.shop.sell{background:color-mix(in srgb,var(--red) 25%,var(--panel))}
.sellMsg{display:none;position:absolute;inset:0;place-items:center;font-family:var(--display);font-size:22px;pointer-events:none;z-index:2}
.shop.sell .sellMsg{display:grid}
.shopL{display:flex;flex-direction:column;gap:7px}
.lvl{display:flex;align-items:center;gap:8px;font-weight:800}
.lvl .px{font-family:var(--display);font-size:17px}
.xpbar{flex:1;height:9px;background:var(--panel3);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#3d86ff,#8fc0ff);transition:width .4s}
.gold{font-family:var(--display);font-size:26px;color:var(--gold);display:flex;align-items:center;gap:7px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c544 45%,#c58a12);border:2px solid #8d5f05;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sbtns{display:flex;gap:6px}
.sbtns .btn{flex:1;padding:7px 6px;font-size:12px}
.odds{display:flex;gap:8px;font-size:11px;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(5,minmax(108px,1fr));gap:10px;overflow-x:auto;padding:2px 2px 4px}
.card{position:relative;border:2px solid var(--cc);border-radius:14px;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:150px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 15%,color-mix(in srgb,var(--cc) 45%,var(--panel2)),var(--panel) 75%);
  box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 45%,#000),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 0 color-mix(in srgb,var(--cc) 45%,#000),0 0 22px color-mix(in srgb,var(--cc) 55%,transparent)}
.card:active{transform:translateY(0)}
.card.off{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.card.off:hover{transform:none}
.card.owned{animation:owned 1.6s ease-in-out infinite}
@keyframes owned{50%{box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 45%,#000),0 0 0 3px var(--gold),0 0 22px var(--gold)}}
.card.empty{border-style:dashed;border-color:var(--line2);background:var(--panel);box-shadow:none;cursor:default;display:grid;place-items:center;color:var(--muted)}
.card .ci{display:grid;place-items:center;height:74px;margin-top:6px}
.card .ci .spr{filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.card .ct{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.card .ct span{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:rgba(0,0,0,.4)}
.card .cbot{margin-top:auto;background:rgba(5,8,20,.72);padding:5px 8px 6px;display:flex;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.08)}
.card .cn{font-weight:900;font-size:13px;line-height:1.1;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cc{font-family:var(--display);color:#ffe18a;font-size:15px;display:flex;align-items:center;gap:3px}
.card .cc::before{content:"";width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c544 45%,#c58a12)}
.card .own{position:absolute;top:6px;right:6px;font-size:10px;font-weight:900;background:var(--gold);color:#3b2604;border-radius:6px;padding:1px 5px}
.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}.c5{--cc:var(--c5)}

.spr{display:inline-grid;place-items:center;width:var(--s);height:var(--s);flex:none}
.spr img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
.tok{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:calc(var(--s)*.22);border:3px solid rgba(255,255,255,.6);text-shadow:0 1px 0 rgba(0,0,0,.35)}

/* ---------- ventanas ---------- */
.modal{position:fixed;inset:0;background:rgba(4,7,18,.68);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.modal.hidden{display:none}
.mbox{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:20px;padding:22px;max-width:860px;width:100%;max-height:90vh;overflow:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mtop{position:sticky;top:-22px;height:0;display:flex;justify-content:flex-end;z-index:3}
.mclose{margin-top:-10px;margin-right:-10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel3);font-size:15px;font-weight:900;cursor:pointer}
.mbox h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px;padding-right:40px;letter-spacing:.02em}
.mbox h3{margin:16px 0 6px;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em}
.mbox p{max-width:68ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.choice{border:2px solid var(--tc,var(--line2));border-radius:16px;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--tc,var(--blue)) 22%,var(--panel3)),var(--panel2));padding:14px;cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.choice:hover{transform:translateY(-3px);box-shadow:0 0 24px color-mix(in srgb,var(--tc,var(--blue)) 45%,transparent)}
.choice .big{font-size:32px}
.choice b{display:block;font-size:16px;margin:6px 0 4px;font-family:var(--display);font-weight:400}
.tierS{--tc:var(--tS)} .tierG{--tc:var(--tG)} .tierP{--tc:var(--tP)}
.choice.tierP{background:linear-gradient(135deg,color-mix(in srgb,#ff7ad9 18%,var(--panel2)),color-mix(in srgb,#5bd6ff 18%,var(--panel2)))}
.tierTag{display:inline-block;padding:2px 10px;border-radius:999px;color:#1a1300;background:var(--tc);font-weight:900;font-size:12px}
.kbd{font-family:var(--display);border:1px solid var(--line2);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:12px}
ul.help{padding-left:18px;margin:6px 0} ul.help li{margin-bottom:4px}
.rtable{overflow-x:auto}
.rtable table{border-collapse:separate;border-spacing:4px;margin:8px 0}
.rtable td,.rtable th{width:46px;height:46px;text-align:center;cursor:help;padding:0}
.rtable th .ii{--ic:#6f7fa8}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field label{font-weight:800}
.field input,.field select{padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--panel3);max-width:340px;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.field input[type=range]{padding:0;box-shadow:none;background:none;accent-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.dexFilters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dexFilters button[aria-pressed="true"]{background:var(--gold);color:#3b2604;border-color:var(--gold)}
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.dexCard{border:2px solid var(--cc);border-radius:14px;background:radial-gradient(120% 90% at 50% 10%,color-mix(in srgb,var(--cc) 30%,var(--panel3)),var(--panel2));padding:6px;text-align:center;cursor:help}
.dexCard .forms{display:flex;justify-content:center;align-items:center}
.dexCard .forms .ar{color:var(--muted);font-size:11px}
.dexCard b{display:block;font-size:12px}
.dexCard span.t{font-size:10.5px;color:var(--muted)}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}
.roomList{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.roomItem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel3);border:1px solid var(--line2)}
.roomItem b{flex:1}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:12px 0}
.seat{padding:8px 10px;border-radius:14px;background:var(--panel3);border:1px solid var(--line2);display:flex;gap:10px;align-items:center;font-weight:800;min-height:62px}
.seat.bot{opacity:.6;font-weight:600}
.seat.host{border-color:var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 30%,transparent)}
.code{font-family:var(--display);font-size:24px;letter-spacing:.12em;background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:2px 12px}

#toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;align-items:center}
#toast div{background:linear-gradient(180deg,#2a3768,#1b2448);color:#fff;border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:12px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;animation:rise .2s ease-out}
#ghost{position:fixed;pointer-events:none;z-index:40;transform:translate(-50%,-50%) scale(1.15);display:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
#tip{position:fixed;z-index:60;max-width:340px;background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.45);pointer-events:none;display:none;font-size:13px}
#tip h4{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:400}
#tip h4 .ii{--is:30px}
#tip .scope{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:6px}
#tip .tl{color:var(--muted);padding:2px 0}
#tip .tl.on{color:var(--ink);font-weight:800}
#tip .tl b{display:inline-block;min-width:26px}
#tip .units{margin-top:8px;font-size:12px;color:var(--muted)}
#tip .units b{color:var(--ink)}
#tip .form{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px}

/* ---------- pantallas completas: acceso y menú ---------- */
.screen{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:24px 16px;overflow:auto;background:transparent}
.screen.hidden{display:none}
/* escena pixel art (cielo, mar, Latios y Latias) detrás del acceso y del menú */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:14;image-rendering:pixelated;image-rendering:crisp-edges;background:#78b8f8;display:none}
body:has(#menu:not(.hidden)) #scene,body:has(#auth:not(.hidden)) #scene{display:block}
.logo{font-family:var(--display);font-size:clamp(44px,8vw,78px);line-height:.95;margin:0;text-align:center;letter-spacing:.02em;color:#ffd75e;
  text-shadow:0 3px 0 #c9661b,0 6px 0 #6a2a0c,0 10px 24px rgba(0,0,0,.55);-webkit-text-stroke:2px #3a1606;paint-order:stroke fill}
.logo small{display:block;font-size:.42em;color:#9cc4ff;text-shadow:0 3px 0 #1b3a8a,0 6px 16px rgba(0,0,0,.5);-webkit-text-stroke:1.5px #0c1a44;letter-spacing:.3em;margin-top:6px}
.glass{background:linear-gradient(180deg,rgba(28,40,88,.9),rgba(14,20,46,.94));border:1px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(8px)}

#auth .authBox{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:18px}
#auth form{width:100%;padding:20px;color:#eef2ff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.3);margin-bottom:6px}
.tabs button{border:0;border-radius:9px;padding:9px;background:transparent;font-weight:900;cursor:pointer;color:#9aa6cc}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#34458a,#25336b);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#auth .field input{max-width:none;width:100%;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.14);color:#fff}
#auth .field input[aria-invalid="true"]{border-color:var(--bad)}
.hint{font-size:12px;color:#93a0c8}
.pw{position:relative}
.pw input{padding-right:52px!important}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9aa6cc;font-weight:900;font-size:12px;cursor:pointer;padding:6px}
.formErr{min-height:20px;color:#ff8f8f;font-weight:800;font-size:13px;margin:6px 0}
#auth .btn.primary{width:100%;padding:12px;font-size:17px;font-family:var(--display);font-weight:400;letter-spacing:.04em}

#menu .menuGrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:center;max-width:960px;width:100%}
.menuL{display:flex;flex-direction:column;align-items:center;gap:22px}
.menuBtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.menuBtns .big{padding:15px;font-size:22px;font-family:var(--display);font-weight:400;letter-spacing:.04em}
.menuRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.menuRow .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;font-size:12px}
.menuRow .btn span{font-size:20px}
.tcard{padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#eef2ff;text-align:center}
.stand{position:relative;width:220px;height:210px;display:grid;place-items:end center}
.stand::before{content:"";position:absolute;bottom:6px;left:50%;width:190px;height:56px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,#5f86ff 0,#3150c9 55%,#1b2a74 80%,transparent 81%);box-shadow:0 0 40px rgba(90,130,255,.6);animation:glow 3s ease-in-out infinite}
.stand img{position:relative;width:180px;height:180px;image-rendering:pixelated;filter:drop-shadow(0 10px 6px rgba(0,0,0,.45));animation:idle 2.4s ease-in-out infinite;transform-origin:50% 100%;margin-bottom:22px}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-7px) scaleY(1.02)}55%{transform:translateY(-7px) scaleY(1.02)}}
@keyframes glow{50%{box-shadow:0 0 60px rgba(120,160,255,.85)}}
.tname{font-family:var(--display);font-size:26px;line-height:1}
.tfrom{font-size:12px;color:#93a0c8;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:6px}
.stats div{background:rgba(0,0,0,.28);border-radius:10px;padding:6px 2px;border:1px solid rgba(255,255,255,.08)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:#ffd75e}
.stats span{font-size:10px;color:#93a0c8;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.tcard .row{justify-content:center;width:100%}
.tcard .btn{flex:1}
.ver{position:fixed;right:12px;bottom:10px;font-size:11px;color:rgba(255,255,255,.35);font-weight:800}

.trGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:12px 0}
.trOpt{border:2px solid var(--line2);border-radius:14px;background:radial-gradient(100% 70% at 50% 100%,color-mix(in srgb,var(--blue) 30%,var(--panel3)),var(--panel2));padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .12s}
.trOpt:hover{transform:translateY(-3px)}
.trOpt img{width:80px;height:80px;image-rendering:pixelated}
.trOpt b{font-size:13px}
.trOpt span{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.trOpt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 50%,transparent);background:radial-gradient(100% 70% at 50% 100%,color-mix(in srgb,var(--gold) 35%,var(--panel3)),var(--panel2))}
.trBar{position:sticky;bottom:-22px;margin:0 -22px -22px;padding:12px 22px;background:linear-gradient(180deg,transparent,var(--panel) 30%);display:flex;gap:10px;align-items:center;justify-content:flex-end}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr;}
  .center{order:-1}
  .right{display:grid;grid-template-columns:1fr 1fr}
  .shop{grid-template-columns:1fr}
  .ucard{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:60vh;z-index:13;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
}
@media (max-width:820px){
  #menu .menuGrid{grid-template-columns:1fr;gap:18px}
  .stand{width:170px;height:160px} .stand img{width:130px;height:130px} .stand::before{width:150px;height:44px}
}
@media (max-width:620px){ .right{grid-template-columns:1fr} .phase{margin-left:0} .menuRow{grid-template-columns:repeat(2,1fr)} .top .brand{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="ball" aria-hidden="true"></span>Poké Tactics</div>
  <div class="stage" id="stage">Ronda 1-1</div>
  <div class="pills" id="pills"></div>
  <span class="netTag" id="netTag" hidden></span>
  <div class="phase" id="phase"></div>
  <button class="btn ghost icon" id="dexBtn" title="Pokédex">📕</button>
  <button class="btn ghost icon" id="recBtn" title="Recetas de objetos">⚒️</button>
  <button class="btn ghost icon" id="muteBtn" title="Música">🔊</button>
  <button class="btn" id="speedBtn" title="Velocidad del combate">x1</button>
  <button class="btn gold" id="readyBtn">¡Listo!</button>
  <button class="btn ghost icon" id="menuBtn" title="Volver al menú">☰</button>
</header>

<main class="layout">
  <aside class="panel">
    <h2>Sinergias</h2>
    <div id="traits"></div>
    <div id="augWrap"></div>
  </aside>
  <section class="center">
    <div class="viewInfo" id="viewInfo" hidden></div>
    <div class="boardInfo"><span id="boardCount"></span><span id="streakInfo"></span><span id="incomeInfo" class="muted"></span></div>
    <div id="boardWrap"><div id="boardStack"><canvas id="gl" aria-hidden="true"></canvas><canvas id="cv" aria-label="Tablero de combate"></canvas></div></div>
    <div class="items" id="items" aria-label="Objetos"></div>
    <div class="feed hidden" id="feed"><h3>Habilidades del combate</h3><ol id="feedList"></ol></div>
  </section>
  <aside class="right">
    <div class="ucard hidden" id="ucard" aria-live="polite"></div>
    <div class="panel"><h2>Entrenadores</h2><div id="players"></div><p class="small muted" id="plHint" style="margin:6px 2px 0"></p></div>
    <div class="panel"><h2>Registro</h2><ul class="log" id="log"></ul></div>
  </aside>
</main>

<footer class="shop" id="shopPanel">
  <div class="sellMsg" id="sellMsg">Suelta para vender</div>
  <div class="shopL">
    <div class="lvl"><span>Nivel <span class="px" id="lvl">1</span></span><div class="xpbar"><i id="xpbar"></i></div><span class="small" id="xpTxt"></span></div>
    <div class="gold"><span class="coin"></span><span id="gold">0</span></div>
    <div class="sbtns">
      <button class="btn" id="xpBtn" title="Comprar 4 de EXP (tecla F)">⬆ EXP · 4</button>
      <button class="btn" id="rerollBtn" title="Nueva tienda (tecla D)">🔄 Tienda · 2</button>
      <button class="btn icon" id="lockBtn" title="Bloquear tienda para la siguiente ronda">🔓</button>
    </div>
    <div class="odds" id="odds" title="Probabilidad de cada coste en tu nivel"></div>
  </div>
  <div class="cards" id="cards"></div>
</footer>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="auth" class="screen">
  <div class="authBox">
    <h1 class="logo">Poké Tactics<small>AUTOCHESS</small></h1>
    <form class="glass" id="authForm" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabLogin" aria-selected="true">Entrar</button>
        <button type="button" role="tab" id="tabReg" aria-selected="false">Crear cuenta</button>
      </div>
      <div class="field"><label for="auUser">Usuario</label><input id="auUser" name="username" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false" required><span class="hint" id="auUserHint" hidden>De 3 a 16 letras, números o _</span></div>
      <div class="field"><label for="auPass">Contraseña</label><div class="pw"><input id="auPass" name="password" type="password" autocomplete="current-password" maxlength="72" required><button type="button" id="auShow" aria-label="Mostrar contraseña">Ver</button></div></div>
      <div class="field" id="auPass2Wrap" hidden><label for="auPass2">Repite la contraseña</label><input id="auPass2" name="password2" type="password" autocomplete="new-password" maxlength="72"></div>
      <div class="formErr" id="auErr" role="alert"></div>
      <button class="btn primary" id="auGo" type="submit">Entrar</button>
    </form>
  </div>
</div>

<div id="menu" class="screen hidden">
  <div class="menuGrid">
    <div class="menuL">
      <h1 class="logo">Poké Tactics<small>AUTOCHESS</small></h1>
      <div class="menuBtns">
        <button class="btn primary big" id="playBtn">Jugar</button>
        <button class="btn big" id="mpBtn">Multijugador</button>
        <div class="menuRow">
          <button class="btn" id="dexMenuBtn"><span>📕</span>Pokédex</button>
          <button class="btn" id="recMenuBtn"><span>⚒️</span>Objetos</button>
          <button class="btn" id="howBtn"><span>📜</span>Guía</button>
          <button class="btn" id="optBtn"><span>⚙️</span>Opciones</button>
        </div>
      </div>
    </div>
    <div class="tcard glass" id="menuWho"></div>
  </div>
  <span class="ver">v1.1</span>
</div>

<div class="modal hidden" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<div id="ghost"></div>
<div id="tip"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module" src="board3d.js"></script>
</body>
