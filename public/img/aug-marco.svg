<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 1212" preserveAspectRatio="none">
<!-- Marco de las cartas de aumento: fondo negro, doble marco dorado con esquinas recortadas, Poké Balls en las esquinas y emblema arriba -->
<defs>
 <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#7a5a2c"/><stop offset=".18" stop-color="#e9cf95"/><stop offset=".36" stop-color="#9c7639"/>
  <stop offset=".55" stop-color="#f2dca6"/><stop offset=".75" stop-color="#8d6a33"/><stop offset="1" stop-color="#d9b977"/>
 </linearGradient>
 <linearGradient id="o2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dfaa"/><stop offset=".5" stop-color="#b48a45"/><stop offset="1" stop-color="#e2c486"/></linearGradient>
 <radialGradient id="f" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#151413"/><stop offset=".6" stop-color="#070707"/><stop offset="1" stop-color="#000"/></radialGradient>
 <g id="b"><circle r="17" fill="#0b0a09" stroke="url(#o2)" stroke-width="4"/><path d="M-15 0a15 15 0 0 0 30 0z" fill="url(#o2)"/><path d="M-15 0h30" stroke="#0b0a09" stroke-width="3.5"/><circle r="5.5" fill="#0b0a09" stroke="url(#o2)" stroke-width="2.6"/></g>
</defs>
<rect width="682" height="1212" fill="url(#f)"/>
<!-- marco exterior: tres hilos (dorado, oscuro, dorado) con las esquinas recortadas en cuarto de círculo -->
<path d="M58 22H624A36 36 0 0 0 660 58V1154A36 36 0 0 0 624 1190H58A36 36 0 0 0 22 1154V58A36 36 0 0 0 58 22Z" fill="none" stroke="url(#o)" stroke-width="9"/>
<path d="M58 22H624A36 36 0 0 0 660 58V1154A36 36 0 0 0 624 1190H58A36 36 0 0 0 22 1154V58A36 36 0 0 0 58 22Z" fill="none" stroke="#1a140b" stroke-width="2.5"/>
<!-- marco interior doble con esquinas escalonadas -->
<path d="M66 44H616V54H628V66H638V1146H628V1158H616V1168H66V1158H54V1146H44V66H54V54H66Z" fill="none" stroke="url(#o)" stroke-width="3.5"/>
<path d="M72 54H610V62H620V72H628V1140H620V1150H610V1158H72V1150H62V1140H54V72H62V62H72Z" fill="none" stroke="url(#o)" stroke-width="1.6" opacity=".75"/>
<!-- Poké Balls de las esquinas (sobre el recorte) -->
<use href="#b" x="26" y="50"/><use href="#b" x="656" y="50"/><use href="#b" x="26" y="1162"/><use href="#b" x="656" y="1162"/>
<!-- emblema de arriba -->
<g transform="translate(341 134) scale(1.85)"><use href="#b"/></g>
</svg>
